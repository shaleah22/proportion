<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solving Proportions Drill</title>
<style>
:root{
  --paper:#ffffff; --grid:#e3ecf5; --ink:#18202c; --muted:#5a6575; --line:#cfd8e3;
  --card:#ffffff; --soft:#f3f6fa;
  --red:#c8102e; --c1:#0f7b6c; --hot:#f76707; --hot-d:#d9480f; --c2:#c2571a; --blue:#1f5fbf; --purple:#6a3d9a; --green:#1b7a4b;
  --red-bg:#fbe9ec; --blue-bg:#e8effb; --purple-bg:#f1eaf8; --green-bg:#e6f4ec;
  --math:Verdana,Geneva,Tahoma,sans-serif;
  --sans:Verdana,Geneva,Tahoma,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;background:#ffffff}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
html,body{height:100%}
.wrap{max-width:1500px;margin:0 auto;padding:14px 20px 16px;height:100%;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
header .sp{flex:1}
.pv{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.pv[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{flex:1;min-height:0}
.game{height:100%;display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"text stage" "ctrl stage";column-gap:28px;row-gap:18px}
.game .ta{grid-area:text}
.game .sw{grid-area:stage;display:flex;align-items:safe center;justify-content:safe center;border-left:1.5px dashed var(--line);min-height:0;overflow:auto}
.game .ctrl{grid-area:ctrl;align-self:start}
@media (max-width:860px){
  html,body{height:auto}
  .wrap{height:auto}
  .game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"text" "stage" "ctrl"}
  .game .sw{border-left:0}
}
h1{font-family:var(--math);font-weight:700;font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.05;margin:0}
footer .dots{justify-content:center}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--muted)}
.dot.cur{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:20px clamp(14px,2.4vw,30px)}
.ptext{margin:0;font-size:1.2rem;max-width:62ch}
.ptext .n{color:var(--muted);font-weight:700;margin-right:6px}
table.rt{border-collapse:collapse;margin:12px 0 0;font-family:var(--math);font-size:1.1rem}
.tblwrap{overflow-x:auto}
table.rt th,table.rt td{border:1.5px solid var(--line);padding:5px 12px;text-align:center;min-width:50px}
table.rt th{font-family:var(--sans);font-size:14px;text-align:left;background:var(--soft)}

.stage{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:clamp(18px,3vw,44px);row-gap:8px;padding:100px 4px 100px;width:100%}
.eqn{display:flex;align-items:center;gap:clamp(16px,4vw,34px)}
.frac{display:flex;flex-direction:column;align-items:center;min-width:4ch}
.bar{height:3px;background:var(--ink);align-self:stretch;margin:6px 0;border-radius:2px}
.cell{font-family:var(--math);font-size:calc(var(--k,1) * clamp(1.8rem,4.6vw,4rem));line-height:1.1;padding:2px 10px;border-radius:10px;display:flex;align-items:baseline;justify-content:center;gap:.22em;white-space:nowrap;transition:background .25s}
.cell .unit{font-style:italic;font-size:.58em;color:var(--muted)}
.cell .var{font-style:italic}
.cell .old{font-size:.55em;color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--blue)}
.cell .simpd{color:var(--blue)}
.cell{position:relative}
.sl{position:relative;display:inline-block;color:var(--muted)}
.sl::after{content:"";position:absolute;left:-12%;right:-12%;top:52%;border-top:3px solid var(--blue);transform:rotate(-24deg);border-radius:2px}
.stack{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;font-size:.78em}
.stack.up{bottom:100%;flex-direction:column-reverse;margin-bottom:4px}
.stack.down{top:100%;flex-direction:column;margin-top:4px}
.stack .cur{color:var(--blue);font-weight:700}
.stack .cin{font-size:.9em;width:2.6em;border-color:var(--blue)}
.cell .ans{color:var(--green);font-weight:700}
.cell.diag{background:var(--purple-bg);box-shadow:0 0 0 2px var(--purple) inset}
.cell.unused{background:var(--blue-bg);box-shadow:0 0 0 2px var(--blue) inset}
.cell.blankc{min-width:3.5ch;height:1.3em;border-bottom:2px dashed var(--line);border-radius:0}
.eq{font-family:var(--math);font-size:calc(var(--k,1) * clamp(1.8rem,4.4vw,3.8rem))}
.cin{font-family:var(--math);font-size:.8em;width:3.6em;text-align:center;padding:2px 4px;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper)}
.cin.wide{width:4.4em}
.bar2>.cin{font-size:1.2rem;width:6em}
.cin:focus{outline:none;box-shadow:0 0 0 4px var(--blue-bg)}
.cin.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arclabel{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:1.15rem;padding:0 6px;background:var(--card);border-radius:6px;white-space:nowrap}
.arcctl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:var(--card);padding:4px;border-radius:10px;z-index:2}
.arcctl .cin{font-size:1.25rem;width:3.4em}
.opbtns{display:inline-flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.opbtns button{border:0;background:var(--paper);padding:3px 10px;font-family:var(--math);font-size:1.25rem;min-width:38px}
.opbtns button+button{border-left:2px solid var(--line)}
.opbtns button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.work{font-family:var(--math);font-size:calc(var(--k,1) * clamp(1.3rem,2.8vw,2.2rem));color:var(--purple);display:grid;gap:6px;justify-items:start}
.work .cin{font-size:1em;width:4.4em;color:var(--ink)}
.work .done{color:var(--muted)}

.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.q{font-weight:700;font-size:1.2rem;margin:0;flex-basis:100%}
.q b{font-family:var(--math)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:10px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.fbk{flex-basis:100%;margin:0;padding:8px 12px;border-radius:8px;font-size:16px}
.fbk.bad{background:var(--red-bg)}
.fbk.hint{background:var(--blue-bg)}
.fbk.good{background:var(--green-bg)}
.fbk:empty{display:none}
.choices{display:flex;flex-direction:column;align-items:stretch;gap:10px;flex-basis:100%}
.mbtn{border:2.5px solid currentColor;background:var(--paper);border-radius:14px;padding:14px 18px;font-weight:700;font-size:1.15rem;text-align:left}
.mbtn:hover{background:var(--soft)}
.mbtn.wrong{opacity:.4;border-style:dashed}
.game .sw{flex-direction:column;gap:10px}
.game .sw.solved{flex-direction:row;align-items:stretch;justify-content:center;gap:0}
.game.solvedgame{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"ctrl" "stage";row-gap:12px}
.game.solvedgame .sw{border-left:0;border-top:1.5px dashed var(--line);padding-top:4px}
.donebar .dtext{flex:1 1 420px;min-width:0}
.donebar .q{flex-basis:auto}
.donebar .alt{margin-top:4px}
.q .n{color:var(--muted);margin-right:4px}
.tabcol{flex:0 0 auto;min-width:0;max-width:46%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px;border-left:1.5px dashed var(--line)}
.eqwrap{flex:none}
.solvecol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.solvecol .stage{flex:none;width:100%}
.eqwrap{max-width:100%;overflow-x:auto;padding:22px 4px 26px}
table.eqt tr:first-child td.unit{box-shadow:inset 3px 0 0 var(--purple),inset -3px 0 0 var(--purple),inset 0 3px 0 var(--purple)}
table.eqt tr:last-child td.unit{box-shadow:inset 3px 0 0 var(--purple),inset -3px 0 0 var(--purple),inset 0 -3px 0 var(--purple)}
table.eqt .utag{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:13px;font-weight:700;color:var(--purple);white-space:nowrap}
.vizcap .ur{color:var(--purple);font-weight:700}
.eqlab{font-size:14px;font-weight:700;color:var(--muted);margin:8px 0 0;align-self:center}
table.eqt{border-collapse:collapse;font-family:var(--math);font-size:clamp(16px,1.6vw,22px)}
table.eqt th{font-family:var(--sans);font-size:clamp(14px,1.2vw,17px);text-align:left;background:var(--soft);padding:6px 10px;border:1.5px solid var(--line);white-space:nowrap}
table.eqt th.c1{color:var(--c1)} table.eqt th.c2{color:var(--c2)}
table.eqt td{border:1.5px solid var(--line);padding:6px 12px;text-align:center;position:relative;min-width:3.2em;white-space:nowrap}
table.eqt td.given{background:var(--blue-bg)}
table.eqt td.ans{background:var(--green-bg);color:var(--green);font-weight:700}
table.eqt .mul{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:13px;font-weight:700;color:var(--blue);white-space:nowrap}
.eqkey{font-size:13px;color:var(--muted);display:flex;gap:14px;justify-content:center}
.eqkey span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.eqkey .kg::before{background:var(--blue-bg)} .eqkey .ka::before{background:var(--green-bg)}
.viz{flex:1.4 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:6px 4px 6px 16px;min-height:0;border-left:1.5px dashed var(--line)}
.vizsvg{width:100%;max-height:calc(100% - 110px);min-height:200px}
@media (max-width:860px){.game .sw.solved{flex-direction:column}.solvecol,.tabcol,.viz{flex:none;width:100%;max-width:none;align-self:stretch}.tabcol{border-left:0;border-top:1.5px dashed var(--line);padding:8px 0}.viz{border-left:0;border-top:1.5px dashed var(--line);padding:12px 0 0}.vizsvg{max-height:none;height:auto}}
.vizcap{margin:0;max-width:56ch;text-align:center;font-size:16px;color:var(--ink)}
.vt{font-family:var(--sans);font-size:20px;fill:var(--ink)}
.vs{font-family:var(--sans);font-size:16px;fill:var(--muted)}
.vc1{fill:var(--c1);color:var(--c1);font-weight:700}.vc2{fill:var(--c2);color:var(--c2);font-weight:700}
.stage.setup{padding:28px 4px;flex-direction:column;row-gap:30px}
.stage.setup .eqn{gap:clamp(12px,3vw,28px)}
.stage.setup .bar{min-width:5.5em}
.slot{min-width:5.5em;min-height:1.7em;font-family:var(--math);font-size:clamp(1.3rem,2.8vw,2.3rem);border:2.5px dashed #aab6c5;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:4px}
.slot.full{border-color:transparent;background:transparent}
.slot.over{border-color:var(--blue);border-style:solid;background:var(--blue-bg)}
.slot.full.over .tile{box-shadow:0 0 0 3px var(--blue)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--soft);min-height:72px;width:100%;max-width:680px;border:2px solid transparent}
.bank.over{border-color:var(--blue)}
.bank:empty::before{content:"All parts placed";color:var(--muted);font-size:15px}
.tile{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:6px 14px;font-family:var(--math);font-size:clamp(1.1rem,2vw,1.6rem);display:inline-flex;gap:.3em;align-items:baseline;cursor:grab;white-space:nowrap}
.slot .tile{font-size:1em;border-color:var(--line)}
.tile i{font-size:.62em;color:var(--muted)}
.tile .var{font-style:italic;font-weight:700}
.tile.sel{background:var(--blue-bg);border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.tile.lift{opacity:.3}
.dragghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 8px 20px rgba(24,32,44,.22);cursor:grabbing;margin:0}
.setupopts{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,1.6vw,22px);padding:10px;width:100%}
.obtn{display:flex;align-items:center;justify-content:center;border:2.5px solid var(--line);background:var(--paper);border-radius:16px;padding:16px 18px;min-width:min(100%,200px)}
.obtn .mini{font-size:clamp(1.25rem,1.6vw,2rem);gap:10px}
.obtn .mini .mb{height:3px}
.obtn:focus-visible,.mbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ans-mark{border-color:var(--green)!important;box-shadow:0 0 0 3px var(--green-bg)}
.pvbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;flex-basis:100%;padding:12px;border-radius:10px;background:var(--soft)}
.pvbar .a{flex-basis:100%;font-size:1.05rem}
.pvbar .a b{font-family:var(--math);color:var(--green);font-size:1.2em}
.pvbar small{flex-basis:100%;color:var(--muted);font-size:13px}
.obtn:hover{border-color:var(--ink)}
.obtn.wrong{opacity:.4;border-style:dashed}
.mini{display:inline-flex;align-items:center;gap:8px;font-family:var(--math);font-size:1.15rem}
.mini .mf{display:inline-flex;flex-direction:column;align-items:center}
.mini .mf i{font-size:.8em;color:var(--muted)}
.mini .mb{height:2px;background:var(--ink);align-self:stretch;margin:2px 0}
.alt{flex-basis:100%;margin:0;font-size:16px;color:var(--muted)}
.score{display:grid;gap:6px;margin-top:10px}
.score div{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;border-radius:8px;background:var(--soft);font-size:15px}
.count{font-size:15px;color:var(--muted);white-space:nowrap}
.tilink{font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tilink:hover{border-color:var(--ink)}
.turnin{position:fixed;inset:0;z-index:100;overflow:auto;background:var(--paper)}
.turnin[hidden]{display:none}
.ti-inner{max-width:1040px;margin:clamp(8px,2vh,24px) auto;padding:20px clamp(18px,3vw,30px) 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;align-items:start;background:var(--paper);border:1.5px solid var(--line);border-radius:14px}
.ti-left{grid-column:1}.ti-right{grid-column:2}
@media (max-width:760px){.ti-inner{grid-template-columns:minmax(0,1fr)}.ti-right{grid-column:1}}
.ti-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ti-chip{border:1.5px solid var(--line);border-radius:8px;padding:4px 9px;font-size:14px;white-space:nowrap}
.ti-chip.retry{border-color:#e6c77a;background:#FFF9EA}
.ti-inner h2{margin:0 0 6px;font-size:24px}
.ti-sub{color:var(--muted);line-height:1.55;margin:0 0 18px}
.ti-recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ti-recap>div{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:14px}
.ti-recap b{display:block;color:var(--ink);font-size:24px}
.ti-log{max-height:200px;overflow:auto;margin-top:16px;padding:6px 0;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.ti-row{display:flex;gap:10px;align-items:baseline;padding:5px 2px;font-size:15px}
.ti-n{color:var(--muted);min-width:28px;text-align:right;font-size:14px}
.ti-q{flex:1;min-width:0}
.ti-k{font-size:13px;white-space:nowrap;color:var(--green)}
.ti-k.retry{color:#8A5A00}
#gform{margin-top:0}
#gform[hidden]{display:none}
.ti-warn{background:#FFF4DB;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.55;font-size:15px}
.ti-field{margin-bottom:10px}
.ti-field label{display:block;margin-bottom:6px}
.ti-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px}
.ti-field input{font:inherit;font-size:17px;color:var(--ink);width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper)}
.ti-field input:focus{outline:2px solid var(--ink);outline-offset:1px}
.ti-check{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0 12px}
.ti-check .hd{color:var(--muted);font-size:14px;margin-bottom:8px}
.ti-check .r{display:flex;gap:12px;align-items:baseline;margin-bottom:4px}
.ti-check .r:last-child{margin-bottom:0;padding-top:6px;border-top:1.5px solid var(--line)}
.ti-check .t{color:var(--muted);min-width:88px;font-size:14px}
.ti-check .v.empty{color:#aab6c5}
.ti-btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:11px 26px;background:var(--ink);color:#fff;cursor:pointer}
.ti-feedback{margin-top:14px;min-height:1.2em}
.ti-feedback .ok{color:var(--green);font-weight:700}
.ti-feedback .nt{color:var(--muted)}
.ti-after{margin-top:16px;padding-top:12px;border-top:1.5px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.ti-ghost{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 16px;background:none;color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Solving Proportions</h1>
    <span class="count" id="count"></span>
    <button class="tilink" id="tiLink" type="button">Turn in</button>
    <span class="sp"></span>
  </header>
  <main id="main"></main>
</div>

<div class="turnin" id="turnin" role="dialog" aria-labelledby="ti-title" hidden>
  <div class="ti-inner">
    <div class="ti-left">
    <h2 id="ti-title">All 10 done</h2>
    <p class="ti-sub" id="ti-sub">Enter your period and name.</p>
    <div class="ti-recap" id="ti-recap"></div>
    <div id="ti-log"></div>
    <div class="ti-after">
      <span id="ti-aftertext"></span>
      <button class="ti-ghost" type="button" id="ti-back">Keep practicing</button>
    </div>
    </div>
    <div class="ti-right">

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none"
            onload="if(window.onHiddenFrameLoad)onHiddenFrameLoad()"></iframe>

    <form action="https://docs.google.com/forms/d/e/1FAIpQLSe4_Gnrq1zyrttA3lSgrVBtMkaVaoMim31ByzoH-orxmfDB2A/formResponse"
          method="POST" target="hidden_iframe" id="gform">
      <div class="ti-warn">Last name in the <b>Last name</b> box, first name in the <b>First name</b> box. Swapped names count as missing.</div>
      <div class="ti-field">
        <label for="studentPeriod"><span class="ti-num">1</span>Period</label>
        <input type="number" id="studentPeriod" placeholder="e.g. 3" min="1" max="10" required>
      </div>
      <div class="ti-field">
        <label for="lastName"><span class="ti-num">2</span>LAST name</label>
        <input type="text" id="lastName" placeholder="Rodriguez" autocomplete="family-name" required>
      </div>
      <div class="ti-field">
        <label for="firstName"><span class="ti-num">3</span>FIRST name</label>
        <input type="text" id="firstName" placeholder="Maria" autocomplete="given-name" required>

const rng=(a,b,s=1)=>{const o=[];for(let v=a;v<=b+1e-9;v+=s)o.push(+v.toFixed(4));return o;};
const N=v=>typeof v==="number"?v.toLocaleString("en-US",{maximumFractionDigits:4}):v;
const M2=v=>(+v).toFixed(2);
const X="x";
function SU(ok,...w){return [{f:ok,ok:true},...w.map(([f,fb])=>({f,fb}))];}
const isIntish=v=>Math.abs(v-Math.round(v))<1e-9;
function classify(c){
  const u=c.indexOf(null), row=(u===0||u===2)?1:0, L=c[row], R=c[row+2];
  const big=Math.max(L,R), sm=Math.min(L,R);
  if(isIntish(big/sm)&&big/sm>=2) return "m1";
  const ti=u>=2?0:2, bi=ti+1, a=c[ti], b=c[bi];
  if(Number.isInteger(a)&&Number.isInteger(b)){
    const g=gcd(a,b);
    if(g>1){const red=(row===0?a:b)/g, other=c[row===0?(ti===0?2:0):(ti===0?3:1)];
      const B=Math.max(red,other), s=Math.min(red,other);
      if(red===1||(isIntish(B/s)&&B/s>=2)) return "simp";}
  }
  return "m2";
}
function answerOf(c){const u=c.indexOf(null),d={0:3,3:0,1:2,2:1}[u],o=[0,1,2,3].filter(k=>k!==u&&k!==d);return c[o[0]]*c[o[1]]/c[d];}

// ---------- pure number problems ----------
function pureGen(method,varName){
  return {pure:true,best:method,gen:()=>{
    let L,R,hide=rnd([0,1]);
    if(method==="m1"){const a=rnd(rng(2,12)),b=rnd(rng(2,12)),k=rnd(rng(2,9));if(a===b)return null;L=[a,b];R=[a*k,b*k];}
    else if(method==="simp"){const p=rnd(rng(1,9)),q=rnd(rng(2,9)),m=rnd(rng(2,6)),n=rnd(rng(2,12));
      if(gcd(p,q)!==1||p===q||n%m===0)return null;L=[p*m,q*m];R=[p*n,q*n];}
    else if(method==="m2"){const a=rnd([2,4,5,8]),b=rnd(rng(3,13)),t=rnd(rng(3,15));
      if(gcd(a,b)!==1||t%a===0||a%t===0)return null;L=[a,b];R=[t,b*t/a];hide=1;}
    else {const a=rnd([1.2,1.6,2.4,3.2,2.5,1.5]),b=rnd([10,12,15,20,24,25]),t=rnd(rng(3,11));L=[a,b];R=[t,b*t/a];hide=1;}
    R=R.slice(); R[hide]=null;
    const cells=rnd([true,false])?[...L,...R]:[...R,...L];
    return {cells,v:varName};
  }};
}

function instantiate(T){
  for(let tries=0;tries<3000;tries++){
    if(T.pure){
      const g=T.gen(); if(!g) continue;
      const c=g.cells; if(c.some(v=>v!==null&&(v<=0)))continue;
      const want=T.best==="dec"?"m2":T.best, cls=classify(c);
      if(cls!==want) continue;
      const ans=answerOf(c); if(!okAns(ans,"dec")||ans>999) continue;
      const q={text:`Solve for ${g.v}.`,cells:c,v:g.v,best:cls};
      q.why=autoWhy(q); return q;
    }
    const v={}; for(const k in T.pick) v[k]=rnd(T.pick[k]);
    if(T.ok&&!T.ok(v)) continue;
    const c=T.cells(v), cls=classify(c);
    if(cls!==T.best) continue;
    const ans=answerOf(c); if(!okAns(ans,T.ans||"int")) continue;
    const q={text:T.text(v),cells:c,units:T.units,v:"x",best:cls,setup:T.setup(v)};
    if(T.table){q.table=T.table(v); if(T.vertical) q.vertical=true;}
    if(T.ur) q.ur=T.ur;
    if(T.follow) q.follow=T.follow(v);
    let w=autoWhy(q); if(T.note) w=T.note(v)+". "+w[0].toUpperCase()+w.slice(1); if(T.whyTail) w+=T.whyTail(v);
    q.why=w; return q;
  }
  throw new Error("could not generate: "+(T.text?T.text.toString().slice(0,60):"pure"));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newSet(){return shuffle(TEMPLATES.map(instantiate));}

const gcd=(a,b)=>b?gcd(b,a%b):a;

function parseNum(s){s=String(s??"").replace(/[$,\s×xX*]/g,"");if(!s)return NaN;if(s.includes("/")){const[a,b]=s.split("/").map(Number);return b?a/b:NaN}return Number(s)}

function relInfo(cells,u){
  const row=(u===0||u===2)?"bottom":"top";
  const iFrom=row==="top"?0:1, L=cells[iFrom], R=cells[iFrom+2];
  const dir=R>=L?"LR":"RL";               // arrow always points small -> big, so it's always ×
  const from=Math.min(L,R), to=Math.max(L,R), k=+(to/from).toFixed(6);
  const uRow=row==="top"?"bottom":"top", uL=uRow==="top"?0:1;
  return {row,from,to,ratio:R/L,op:"×",k,dir,uRow,uL,uR:uL+2};
}
function m1Steps(cells,u,p,method){
  const r=relInfo(cells,u);
  const src=r.dir==="LR"?r.uL:r.uR, tgt=r.dir==="LR"?r.uR:r.uL;
  const lab="× "+fmt(r.k);
  const steps=[{type:"op",method,row:r.row,dir:r.dir,k:r.k,from:r.from,to:r.to,
     q:`${r.row==="top"?"Tops":"Bottoms"}: <b>${fmt(r.from)} → ${fmt(r.to)}</b>`,
     hint:`${fmt(r.to)} ÷ ${fmt(r.from)} = ?`,
     apply:v=>{v.arcs[r.row]={label:lab,method,dir:r.dir};v.arcs[r.uRow]={label:lab,method,dir:r.dir};}}];
  if(tgt===u){
    const known=cells[src], ans=known*r.k;
    steps.push({type:"cell",method,ans,q:`Same to the ${r.uRow}s: <b>${fmt(known)} × ${fmt(r.k)}</b>`,
      hint:`${fmt(known)} × ${fmt(r.k)}`,apply:(v)=>{v.solved=ans;}});
  } else {
    const known=cells[tgt], ans=known/r.k;
    steps.push({type:"cell",method,ans,trap:{val:known*r.k,msg:`<b>${p.v} × ${fmt(r.k)}</b> has to equal <b>${fmt(known)}</b>.`},
      q:`<b>${p.v} × ${fmt(r.k)} = ${fmt(known)}</b>`,hint:`Undo it: ${fmt(known)} ÷ ${fmt(r.k)}`,apply:(v)=>{v.solved=ans;}});
  }
  return steps;
}

function check(p,st,s,silent){

  if(s.type==="cell"){

  if(s.type==="work"){

  if(s.type==="op"){

var GOAL=10,DRILL_NAME="Proportions",records=[],submitted=false,submittedAt=0,sentOn=false;
function recordDone(p,st){
  const c=solvedCells(p,st), u=p.cells.indexOf(null), unit=p.units?uname(p,u%2):"";
  const shown=p.cells.map((v,i)=>i===u?p.v:(p.units&&isM(p.units[i%2])?"$"+mval(v):fmt(v)));
  const q=p.units?p.text.replace(/<[^>]+>/g,""):`${shown[0]}/${shown[1]} = ${shown[2]}/${shown[3]}`;
  const a=isM(unit)?"$"+(+c[u]).toFixed(2).replace(/\.00$/,""):fmt(+c[u].toFixed(4))+(unit?" "+unit:"");
  records.push({q,a:p.follow?`${a}; ${p.follow.ans} in all`:a,clean:!(st.mistakes>0)});
}
function dueTurnIn(){return records.length===GOAL&&!sentOn&&S[cur].done;}
function setCount(){
  const n=records.length;
  $("count").textContent=n<GOAL?`${n} of ${GOAL} done`:`${n} done`;
}
function cleanCount(){return records.filter(r=>r.clean).length;}
function escHtml(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function turninOpen(){return !document.getElementById("turnin").hidden;}
function showTurnIn(){
  if(records.length>=GOAL) sentOn=true;
  const n=records.length,clean=cleanCount(),early=n<GOAL;
  $("ti-title").textContent=early?"Turn in early":n>GOAL?n+" problems done":"All "+GOAL+" done";
  $("ti-sub").textContent=early?n+" of "+GOAL+" done. Enter your period and name.":"Enter your period and name.";
  $("ti-recap").innerHTML="<div>Problems<b>"+n+"</b></div><div>No mistakes<b>"+clean+"</b></div><div>Needed a retry<b>"+(n-clean)+"</b></div>";
  $("ti-log").innerHTML=n?'<div class="ti-chips">'+records.map((r,i)=>'<div class="ti-chip'+(r.clean?"":" retry")+'" title="'+escHtml(r.q)+'"><span class="ti-n">'+(i+1)+'.</span> <b>'+escHtml(r.a)+'</b> <span class="ti-k'+(r.clean?"":" retry")+'">'+(r.clean?"✓":"retry")+"</span></div>").join("")+"</div>":"";
  const more=submitted&&n>submittedAt;
  $("gform").hidden=submitted&&!more;
  if(more){$("ti-feedback").innerHTML='<span class="nt">You turned in '+submittedAt+". Send again to update to "+n+".</span>";$("ti-submit").textContent="Send updated results";}
  else if(!submitted){$("ti-feedback").innerHTML="";$("ti-submit").textContent="Submit Results";}
  $("ti-aftertext").textContent="";
  $("ti-back").textContent=early?"Back to the problems":"Keep practicing";
  $("formScore").value=n;
  $("turnin").hidden=false; $("turnin").scrollTop=0; fitTurnin();
  if(!submitted||more)setTimeout(()=>{$(submitted?"ti-submit":"studentPeriod").focus();},50);
}
function fitTurnin(){
  const t=$("turnin"), inner=t.querySelector(".ti-inner"); let z=1; inner.style.zoom=1;
  while(t.scrollHeight>t.clientHeight+1&&z>0.55){z=+(z-0.04).toFixed(2);inner.style.zoom=z;}
}
window.addEventListener("resize",()=>{if(turninOpen())fitTurnin();});
function backToPractice(){
  $("turnin").hidden=true;
  if(S[cur].done&&records.length>=GOAL){ if(cur<P.length-1)cur++; else results=true; }
  render();
}
window.onHiddenFrameLoad=function(){
  if(!submitted)return;
  $("ti-feedback").innerHTML='<span class="ok">Submitted.</span>';
  $("gform").hidden=true; fitTurnin();
};
function nameCheck(){
  const ln=$("lastName").value.trim(),fn=$("firstName").value.trim();
  const row=(t,v)=>'<div class="r"><span class="t">'+t+'</span><span class="v'+(v?"":" empty")+'">'+(v?escHtml(v):"\u2014")+"</span></div>";
  $("nameCheck").innerHTML='<div class="hd">Check your name:</div>'+row("Last name",ln)+row("First name",fn)+row("Roll call",ln&&fn?ln+", "+fn:"");
}
["lastName","firstName"].forEach(id=>$(id).addEventListener("input",nameCheck));
nameCheck();
$("gform").addEventListener("submit",function(){
  const ln=$("lastName").value.trim(),fn=$("firstName").value.trim();
  $("studentName").value="Period "+$("studentPeriod").value.trim()+" \u2014 "+ln+" \u2014 "+fn
    +" \u2014 "+cleanCount()+" clean solves \u2014 "+DRILL_NAME+" ("+records.length+" problems)";
  $("formScore").value=records.length;
  submitted=true;submittedAt=records.length;
});
$("ti-back").addEventListener("click",backToPractice);
$("tiLink").addEventListener("click",()=>{$("tiLink").blur();showTurnIn();});

render();
</script>
</body>
</html>
